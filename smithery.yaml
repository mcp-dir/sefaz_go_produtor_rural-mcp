# Smithery configuration for SEFAZ GO: Produtor Rural
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_sefaz_go_produtor_rural

name: sefaz_go_produtor_rural-mcp
displayName: "SEFAZ GO: Produtor Rural"
description: >
  SEFAZ GO: Produtor Rural, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/sefaz_go_produtor_rural-mcp
repository: https://github.com/mcp-dir/sefaz_go_produtor_rural-mcp

tags:
  - sefaz_go_produtor_rural
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_sefaz_go_produtor_rural

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_sefaz_go_produtor_rural/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
